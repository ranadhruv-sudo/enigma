name: Terraform CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1

jobs:
  full-pipeline:
    name: Terraform Plan → Apply → Deploy App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format (All Files)
        run: terraform fmt -recursive -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true

      - name: Terraform Plan
        run: terraform plan -out=tfplan.binary

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan.binary

      - name: Get EC2 Public IP
        id: ip
        run: |
          EC2_IP=$(terraform output -raw aws_instance_public_ip)
          echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV
          echo "Public IP is $EC2_IP"

      - name: Wait for SSH to become available
        run: |
          for i in {1..10}; do
            echo "⏳ Attempt $i: Trying SSH to $EC2_IP..."
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@$EC2_IP "echo '✅ SSH connected'" 2>/dev/null; then
              echo "✅ SSH successful on attempt $i"
              exit 0
            else
              echo "❌ SSH failed (attempt $i), retrying in 10 seconds..."
              echo "ec2user:- ${{secrets.EC2_USER}}"
              sleep 10
            fi
          done
          echo "❌ Timeout: SSH connection could not be established after 10 attempts."
          exit 1

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_IP >> ~/.ssh/known_hosts

      - name: Copy app to EC2
        run: |
          scp -o StrictHostKeyChecking=yes -r ./app ${{ secrets.EC2_USER }}@$EC2_IP:/tmp/

      - name: Deploy app on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@$EC2_IP << 'EOF'
            sudo mkdir -p /var/www/html/
            sudo cp -r /tmp/app/* /var/www/html/
            sudo systemctl restart httpd || sudo systemctl restart nginx || echo "Web server not running."
          EOF
