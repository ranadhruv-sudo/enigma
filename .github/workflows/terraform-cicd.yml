name: Terraform CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1

jobs:
  full-pipeline:
    name: Terraform Plan → Apply → Deploy App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format (All Files)
        run: terraform fmt -recursive -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true

      - name: Terraform Plan
        run: terraform plan -out=tfplan.binary

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan.binary

      - name: Get EC2 Public IP
        id: ip
        run: |
          echo "EC2_IP=$(terraform output -raw ec2_public_ip)" >> $GITHUB_ENV
          echo "Public IP is $EC2_IP"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_IP >> ~/.ssh/known_hosts

      - name: Copy app to EC2
        run: |
          scp -o StrictHostKeyChecking=yes -r ./app ${{ secrets.EC2_USER }}@$EC2_IP:/tmp/

      - name: Deploy app on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@$EC2_IP << 'EOF'
            sudo mkdir -p /var/www/html/
            sudo cp -r /tmp/app/* /var/www/html/
            sudo systemctl restart httpd || sudo systemctl restart nginx || echo "Web server not running."
          EOF
